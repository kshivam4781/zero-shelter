name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The matrix is the point: fingerprints must be identical on every host,
    # so a green run on one OS proves nothing on its own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  third-party:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # THIRD_PARTY.md feeds the contest SBOM (붙임1). Regenerating it in CI
      # keeps it from drifting away from package.json between releases.
      - run: npm run third-party

      - name: Fail if THIRD_PARTY.md is stale
        run: git diff --exit-code THIRD_PARTY.md
