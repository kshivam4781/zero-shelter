name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The org allows only actions/checkout and requires SHA pinning, so this
# workflow uses the Node preinstalled on each runner instead of setup-node.
# That costs us the Node 20/22 dimension — see issue "CI에 Node 버전 매트릭스 복구".

jobs:
  test:
    # The OS matrix is the point: fingerprints must be identical on every host,
    # so a green run on one of them proves nothing on its own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: node --version

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  third-party:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci

      # THIRD_PARTY.md feeds the contest SBOM (붙임1). Regenerating it in CI
      # keeps it from drifting away from package.json between releases.
      - run: npm run third-party

      - name: Fail if either THIRD_PARTY file is stale
        run: git diff --exit-code THIRD_PARTY.md THIRD_PARTY.ko.md
